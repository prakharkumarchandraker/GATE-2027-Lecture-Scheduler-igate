<style>:root{--paper:#EFF1EC;--line:#DDE1D7;--ink:#14191A;--ink2:#454D4A;--ink3:#697169;
--pen:#27436F;--plum:#5D4064;--moss:#2F6B48;--clay:#A34328;--card:#FCFCFA;--edge:#D6DACE;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
background-size:28px 28px;color:var(--ink);
font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;font-weight:450;
padding-bottom:92px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:14px 13px 0}
h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:-.02em;font-size:26px;margin:0 0 14px}
h2{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:-.01em;font-size:18px;margin:0 0 8px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.muted{color:var(--ink2);font-weight:500}
.faint{color:var(--ink3);font-weight:500}
.sm{font-size:14px}.xs{font-size:13px}.hidden{display:none}
.lt{color:var(--clay)!important}
.grow{flex:1}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bigclock{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.03em;
 line-height:1;color:var(--pen);font-variant-numeric:tabular-nums}
.tb2{flex:1;min-width:0}
.tbd{font-size:14px;font-weight:600;color:var(--ink)}
.tbc{font-size:13px;color:var(--ink2);font-weight:500}
.tbc b{color:var(--ink);font-weight:700}
.gear{border:1px solid var(--edge);background:var(--card);border-radius:9px;width:38px;height:38px;font-size:17px;color:var(--ink2);cursor:pointer;flex:0 0 auto}

.card{background:var(--card);border:1px solid var(--edge);border-radius:11px;padding:15px;margin-bottom:13px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}

/* slots */
.slot{margin-bottom:11px;background:var(--card);border:1px solid var(--edge);border-radius:11px;overflow:hidden}
.sh{display:flex;align-items:center;gap:9px;padding:12px 13px;border-bottom:1px solid var(--line);background:#F4F6F0}
.clock{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink2);font-weight:500;flex:0 0 auto}
.sh .nm{flex:1;font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{padding:2px 13px 11px}
.brk{display:flex;align-items:center;gap:9px;padding:9px 14px;margin-bottom:11px;border:1px dashed var(--edge);
 border-radius:9px;font-size:14px;color:var(--ink2);background:transparent;font-weight:500}
.brk.meal{border-style:solid;background:#F6F3EC;color:#6B5B3E}
.brk b{color:inherit}
.pr{padding:11px 0;font-size:14px;color:var(--ink2)}

/* rows */
.row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.box{flex:0 0 auto;width:24px;height:24px;border:2px solid var(--ink3);border-radius:6px;background:#fff;
 cursor:pointer;margin-top:1px;display:grid;place-items:center;padding:0}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:.15s}
.box[aria-checked="true"]{background:var(--moss);border-color:var(--moss)}
.box[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.row.done .t{color:var(--ink3);text-decoration:line-through}
.body{flex:1;min-width:0}
.t{font-weight:600;font-size:15.5px;word-break:break-word;line-height:1.35}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:13px;font-weight:500}
.mod{font-weight:600}
.src{color:var(--ink3);font-weight:500}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;display:inline-block}
.len{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);font-weight:500;flex:0 0 auto;text-align:right}
.lensp{color:var(--ink3);font-size:12.5px}
.stage{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--plum);border:1px solid #D9CBDB;
 background:#F7F1F8;border-radius:5px;padding:1px 6px;font-weight:500}
.qa{margin-top:8px;border-left:3px solid var(--plum);padding-left:11px}
.qarow{display:flex;gap:6px;margin-bottom:6px}
.qarow input{font-size:14px;padding:7px 9px}
.qarow input:first-child{flex:1.3}.qarow input:last-child{flex:1}
.qa .q{font-size:14.5px;padding:8px 0;cursor:pointer;border-bottom:1px dashed var(--line);font-weight:500}
.qa .a{font-size:14px;color:var(--moss);padding:3px 0 8px;font-weight:500}

/* day / week lists */
.dayrow{border-top:1px solid var(--line);padding:4px 0}
.dayrow summary{padding:10px 2px;cursor:pointer}
.dd{font-weight:600;font-size:15px}
.dn{font-size:13.5px;color:var(--ink2);margin-left:8px;font-weight:500}
.ds{font-size:13px;color:var(--ink3);margin-top:3px;font-weight:500}
.row2{display:flex;gap:10px;align-items:flex-start;padding:9px 0 9px 6px;border-top:1px solid var(--line)}
.rt{flex:1;font-size:14.5px;font-weight:500;min-width:0}
details summary::-webkit-details-marker{display:none}
details>summary{list-style:none}
details.card>summary{font-size:15px}

/* buttons + inputs */
button{font-family:inherit;font-size:15px}
.btn{border:1px solid var(--pen);background:var(--pen);color:#fff;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:500;line-height:1.25}
.btn.quiet{background:#fff;color:var(--ink2);border-color:var(--edge)}
.btn.wide{width:100%}.btn:disabled{opacity:.35}
.mini{padding:5px 9px;font-size:13px;border-radius:7px}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--edge);border-radius:9px;
 padding:10px 11px;background:#fff;color:var(--ink);width:100%;font-weight:450}
textarea{min-height:130px;font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.6}
label.f{display:block;margin:12px 0 5px;font-size:14px;color:var(--ink2);font-weight:500}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.link{color:var(--pen);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;
 text-underline-offset:2px;font-size:13.5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* settings rows */
.setrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.sl{flex:1;font-size:14.5px;font-weight:500}
.si{width:96px;flex:0 0 auto;text-align:center;padding:9px 6px;font-size:14px}

/* speed */
.spd{display:flex;gap:6px;margin-top:11px}
.spd button{flex:1;border:1px solid var(--edge);background:#fff;color:var(--ink2);border-radius:8px;
 padding:9px 0;cursor:pointer;font-size:14px;font-family:"IBM Plex Mono",monospace;font-weight:500}
.spd button.on{background:var(--pen);border-color:var(--pen);color:#fff;font-weight:600}

/* table */
.tbl{margin-top:11px;font-size:14px}
.tr{display:grid;grid-template-columns:.8fr 1.1fr .8fr 1.1fr;padding:9px 0;border-top:1px solid var(--line);
 font-family:"IBM Plex Mono",monospace;font-weight:500}
.tr.th{border-top:0;color:var(--ink3);font-size:12.5px;font-family:"IBM Plex Sans",sans-serif}
.tr.cur{background:#EDF1F7;font-weight:600}
.tr .good{color:var(--moss)}.tr .bad{color:var(--clay)}

/* subject blocks */
.sub2{padding:14px 0;border-top:1px solid var(--line)}
.sub2:first-of-type{border-top:0;padding-top:4px}
.s2h{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.s2h b{font-size:16px;font-weight:600}
.src2{font-size:13px;color:var(--ink3);margin-bottom:8px;font-weight:500}
.s2m{font-size:13.5px;color:var(--ink2);margin-top:5px;font-weight:500}
.modh{display:flex;align-items:center;gap:8px;background:#F3F5EF;border:1px solid var(--edge);
 border-radius:8px;padding:9px 10px;margin:12px 0 4px}
.pill{font-size:12px;border:1px solid var(--edge);border-radius:20px;padding:1px 8px;color:var(--ink2);font-weight:500}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.bignum{display:flex;align-items:baseline;gap:10px}
.num{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:42px;letter-spacing:-.03em}
.edt{border:0;border-bottom:1px dashed var(--edge);border-radius:0;padding:3px 0;font-size:15px;background:transparent;font-weight:500}
.edt:focus{border-bottom-color:var(--pen)}
.edn{width:78px;border:1px solid var(--edge);border-radius:6px;padding:3px 6px;font-size:12.5px;
 font-family:"IBM Plex Mono",monospace;font-weight:500}
.warn{background:#FAF1ED;border-color:#E5CDC3}.ok{background:#EFF6F1;border-color:#C8DFD0}
.empty{text-align:center;padding:22px 10px;color:var(--ink2);font-size:14.5px;font-weight:500}
pre{background:#F3F5EF;border:1px solid var(--edge);border-radius:8px;padding:10px;overflow:auto;font-size:13px;margin:9px 0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(252,252,250,.98);border-top:1px solid var(--edge);
 padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:11px 2px 14px;color:var(--ink3);cursor:pointer;font-size:12.5px;
 display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button[aria-current="true"]{color:var(--pen)}
nav .pip{width:6px;height:6px;border-radius:50%;background:transparent}
nav button[aria-current="true"] .pip{background:var(--pen)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@keyframes slideL{from{opacity:.35;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.35;transform:translateX(-26px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#app{animation:none!important}}
.navin{position:relative}

async function rawGet(){

  try{return localStorage.getItem(KEY)}catch(e){return null}}

  if(typeof window.storage!=='undefined'){try{await window.storage.set(KEY,v)}catch(e){}return}
  try{localStorage.setItem(KEY,v)}catch(e){}}

const D=x=>new Date(x+'T00:00:00');
const iso=d=>{const z=new Date(d);z.setHours(12,0,0,0);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((D(b)-D(a))/864e5);

const uid=()=>Math.random().toString(36).slice(2,9);
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{const d=D(s);return DAYN[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmt2=s=>{const d=D(s);return d.getDate()+' '+MON[d.getMonth()]};
const clock=m=>{m=Math.round(m)%1440;if(m<0)m+=1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const snap=m=>Math.round(m/5)*5, snapUp=m=>Math.ceil(m/5)*5;
const SPEEDS=[1,1.25,1.5,1.75,2];

function parseLen(s){s=String(s).trim();let m;
 if(m=s.match(/(\d+):(\d{1,2}):(\d{1,2})$/))return +m[1]*60+ +m[2]+(+m[3]>=30?1:0);
 if(m=s.match(/(\d+):(\d{1,2})$/))return +m[1]+(+m[2]>=30?1:0);
 if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:hr|hrs|h)$/i))return Math.round(+m[1]*60);
 if(m=s.match(/(\d+(?:\.\d+)?)\s*(?:min|mins|m)$/i))return Math.round(+m[1]);
 if(m=s.match(/^(\d{1,3})$/))return +m[1];
 return null}
function parseList(text,defLen){
  const out=[];let mod='General';
  String(text).split(/\r?\n/).forEach(raw=>{
    let ln=raw.trim();if(!ln)return;
    if(/^#{1,3}\s/.test(ln)){mod=ln.replace(/^#{1,3}\s*/,'').trim()||'General';return}
    let skip=false;if(ln[0]==='~'){skip=true;ln=ln.slice(1).trim()}
    let title=ln,len=null;const p=ln.split('|');
    if(p.length>1){title=p.slice(0,-1).join('|').trim();len=parseLen(p[p.length-1])}
    else{const m=ln.match(/^(.*?)[\s\-]+((?:\d+:)?\d{1,3}(?::\d{1,2})?\s*(?:min|mins|m|hr|hrs|h)?)$/i);
      if(m&&parseLen(m[2])!=null){title=m[1].trim();len=parseLen(m[2])}}
    if(!title)return;out.push({id:uid(),t:title,mod,len:len||defLen,skip})});
  return out}

const W=(len,sp)=>Math.round(len/(sp||S.cfg.speed||1));
function isGym(d){const g=S.cfg.gym;if(!g||!g.on)return false;
 if(g.mode==='week')return (g.days||[]).indexOf(D(d).getDay())>=0;
 return Math.abs(diffD(g.anchor,d))%2===0}
const prof=d=>isGym(d)?S.cfg.day.gym:S.cfg.day.study;
const startFor=d=>snap(prof(d).start);
const endFor=d=>snap(prof(d).end);
function startMin(){return (S.startedAt&&S.startedAt.date===today())?S.startedAt.at:startFor(today())}
function windowFor(d,st){const a=st!=null?st:startFor(d),e=endFor(d);
 let w=Math.max(0,e-a);
 (S.cfg.meals||[]).forEach(m=>{if(m&&m.m>0&&m.t>=a&&m.t+m.m<=e)w-=m.m});
 const nb=Math.max(1,Math.min(6,Math.ceil(w/120)));
 return Math.max(0,w-(S.cfg.gap||10)*(nb-1))}
const hoursFor=d=>windowFor(d)/60;
let BUDCAP=null;
const budget=d=>{const b=d===today()?windowFor(d,startMin()):windowFor(d);
 return BUDCAP==null?b:Math.min(b,BUDCAP)};
const subsIn=tr=>S.subs.filter(s=>s.on&&s.track===tr).sort((a,b)=>a.ord-b.ord);
function lectsOf(s){const mo=(s.modOrd&&s.modOrd.length)?s.modOrd:[...new Set(s.lects.map(l=>l.mod))];
 return s.lects.map((l,i)=>({l,i,k:mo.indexOf(l.mod)})).sort((a,b)=>((a.k<0?99:a.k)-(b.k<0?99:b.k))||a.i-b.i).map(x=>x.l)}
const pend=s=>lectsOf(s).filter(l=>!l.skip&&!S.done[l.id]);
const queue=tr=>subsIn(tr).flatMap(s=>pend(s).map(l=>({s,l})));
function findLect(id){for(const s of S.subs){const l=s.lects.find(x=>x.id===id);if(l)return{s,l}}return null}
function totals(){let t=0,d=0,tm=0,dm=0,raw=0,rawD=0;S.subs.forEach(s=>{if(!s.on)return;s.lects.forEach(l=>{if(l.skip)return;
 t++;raw+=l.len;tm+=W(l.len);if(S.done[l.id]){d++;dm+=W(l.len);rawD+=l.len}})});return{t,d,tm,dm,raw,rawD}}

function makePool(){return{A:queue('A'),B:queue('B'),ai:0,bi:0,
  em:subsIn('em').map(s=>pend(s).map(l=>({s,l}))),
  side:subsIn('side').map(s=>pend(s).map(l=>({s,l})))}}
const poolLeft=p=>(p.A.length-p.ai)+(p.B.length-p.bi)
  +p.em.reduce((a,b)=>a+b.length,0)+p.side.reduce((a,b)=>a+b.length,0);

function assignDay(pool,date,dayIdx,revM,pre,sp){
  const bud=budget(date);
  const res={em:[],A:[],B:[],side:[],prac:0,video:0,bud,rev:revM};
  if(bud<=0)return res;
  const P=pre||{em:0,A:0,B:0,side:0};
  let used=revM+P.em+P.A+P.B+P.side;
  if(!P.em){const ea=pool.em.filter(a=>a.length);
    if(ea.length){const q=ea[dayIdx%ea.length],it=q[0],w=W(it.l.len,sp);
      if(used+w<=bud){res.em.push(it);q.shift();used+=w;res.video+=w}}}
  const free=Math.max(0,bud-used),vb=free-Math.round(free*0.12);
  const takers=[
   {k:'A',cap:vb*0.50,spent:P.A,peek:()=>pool.ai<pool.A.length?pool.A[pool.ai]:null,pop:()=>pool.A[pool.ai++]},
   {k:'B',cap:vb*0.34,spent:P.B,peek:()=>pool.bi<pool.B.length?pool.B[pool.bi]:null,pop:()=>pool.B[pool.bi++]},
   {k:'side',cap:vb*0.16,spent:P.side,
    peek:()=>{const a=pool.side.filter(x=>x.length);return a.length?a[dayIdx%a.length][0]:null},
    pop:()=>{const a=pool.side.filter(x=>x.length);return a[dayIdx%a.length].shift()}}];
  let vUsed=0;
  takers.forEach(tk=>{let s2=tk.spent;
    for(;;){const it=tk.peek();if(!it)break;const w=W(it.l.len,sp);
      if(s2+w>tk.cap||vUsed+w>vb)break;
      res[tk.k].push(tk.pop());s2+=w;vUsed+=w;res.video+=w}});
  const emT={k:'em',peek:()=>{const a=pool.em.filter(x=>x.length);return a.length?a[dayIdx%a.length][0]:null},
    pop:()=>{const a=pool.em.filter(x=>x.length);return a[dayIdx%a.length].shift()}};
  let go2=true;
  while(go2){go2=false;
    for(const tk of takers.concat(S.cfg.emFill===false?[]:[emT])){
      const it=tk.peek();if(!it)continue;const w=W(it.l.len,sp);
      if(vUsed+w<=vb){res[tk.k].push(tk.pop());vUsed+=w;res.video+=w;go2=true}}}
  res.prac=Math.max(0,bud-used-vUsed);
  return res}

function simulate(sp){
  sp=sp||S.cfg.speed;
  if(SIMC[sp])return SIMC[sp];
  const pool=makePool();
  const cnt={},fin={};S.subs.forEach(s=>{if(s.on&&pend(s).length)cnt[s.id]=pend(s).length});
  const days=[];let d=today(),g=0;
  const revEst=Math.round(S.cfg.revCap*0.8);
  while(poolLeft(pool)>0&&g<500){
    const r=assignDay(pool,d,g,g===0?dueRev(today()).mins:revEst,null,sp);
    if(r.bud>0)days.push({d,r});
    [...r.em,...r.A,...r.B,...r.side].forEach(it=>{if(cnt[it.s.id]!=null&&--cnt[it.s.id]===0)fin[it.s.id]=d});
    d=addD(d,1);g++}
  const vid=days.reduce((a,b)=>a+b.r.video,0);
  const out={days,end:days.length?days[days.length-1].d:today(),fin,avg:days.length?vid/days.length:0,n:days.length};
  SIMC[sp]=out;return out}

const OFF=[1,3,7,14];
const STG=['1 day','3 days','7 days','14 days'];
const revMins=(l,stage)=>Math.max(2,Math.min(9,Math.round(W(l.len)*(stage<=1?.07:.045))));
const nextDue=stage=>stage<OFF.length?OFF[stage]:21;
function dueRev(date){const out=[];
 for(const id in S.done){const r=S.done[id];if(r.stage>=99||!r.due||r.due>date)continue;
  const f=findLect(id);if(!f)continue;
  out.push({kind:'lect',id,s:f.s,l:f.l,stage:r.stage,due:r.due,mins:revMins(f.l,r.stage)})}
 for(const k in S.mods){const m=S.mods[k];if(m.due>date)continue;
  const i=k.indexOf('|'),s=S.subs.find(x=>x.id===k.slice(0,i));if(!s)continue;
  const mod=k.slice(i+1),ls=s.lects.filter(l=>l.mod===mod&&S.done[l.id]);if(!ls.length)continue;
  out.push({kind:'mod',id:k,s,mod,n:ls.length,due:m.due,mins:Math.min(25,Math.max(6,ls.length*2))})}
 out.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:(a.kind==='lect'?-1:1));
 let acc=0;const keep=[];
 for(const r of out){if(acc&&acc+r.mins>S.cfg.revCap)break;acc+=r.mins;keep.push(r)}
 return{items:keep,hidden:out.length-keep.length,mins:acc,all:out}}
function futureRev(days){const map={};
 for(const id in S.done){const r=S.done[id];if(r.stage>=99||!r.due)continue;
  const f=findLect(id);if(!f)continue;
  (map[r.due]=map[r.due]||[]).push({kind:'lect',s:f.s,l:f.l,stage:r.stage,mins:revMins(f.l,r.stage)})}
 for(const k in S.mods){const m=S.mods[k],i=k.indexOf('|');
  const s=S.subs.find(x=>x.id===k.slice(0,i));if(!s)continue;
  const mod=k.slice(i+1),ls=s.lects.filter(l=>l.mod===mod&&S.done[l.id]);if(!ls.length)continue;
  (map[m.due]=map[m.due]||[]).push({kind:'mod',s,mod,n:ls.length,mins:Math.min(25,Math.max(6,ls.length*2))})}
 return Object.keys(map).sort().filter(d=>diffD(today(),d)<=days).map(d=>({d,items:map[d]}))}
function revLoad(){const T=totals(),dLeft=Math.max(1,diffD(today(),S.cfg.backup));
 const cyc=Math.max(0,Math.floor((dLeft-14)/21));
 const nMod=S.subs.reduce((a,s)=>a+((s.modOrd&&s.modOrd.length)||1),0);
 return{full:(T.t*(4*4+cyc*3))/dLeft,smart:(T.t*12+nMod*cyc*12)/dLeft,dLeft}}

function planToday(){
  const date=today(),rev=dueRev(date),pool=makePool();
  const dn=[];for(const id in S.done)if(S.done[id].d===date){const f=findLect(id);if(f)dn.push(f)}
  const pre={em:0,A:0,B:0,side:0};dn.forEach(x=>{pre[x.s.track]+=W(x.l.len)});
  const g=Math.max(0,diffD(S.cfg.start,date));
  return{rev,doneToday:dn,r:assignDay(pool,date,g,rev.mins,pre,S.cfg.speed)}}

function TK(id){if(S.done[id])delete S.done[id];else S.done[id]={d:today(),stage:0,due:addD(today(),1),qa:[]};save();render()}
function RD(id){const it=dueRev(today()).all.find(x=>x.id===id);if(!it)return;
 if(it.kind==='mod')S.mods[it.id]={due:addD(today(),21),last:today()};
 else{const r=S.done[it.id];r.stage=(r.stage||0)+1;
  if(S.cfg.revMode==='full'||r.stage<OFF.length)r.due=addD(today(),nextDue(r.stage));
  else{r.stage=99;r.due=null;const k=it.s.id+'|'+it.l.mod;if(!S.mods[k])S.mods[k]={due:addD(today(),21),last:today()}}}
 save();render()}
function RF(id){const it=dueRev(today()).all.find(x=>x.id===id);if(!it)return;
 if(it.kind==='mod')S.mods[it.id]={due:addD(today(),3),last:today()};
 else{const r=S.done[it.id];r.stage=0;r.due=addD(today(),1)}
 save();render()}
function QA(id,i,f,v){const r=S.done[id];if(!r)return;r.qa=r.qa||[];r.qa[i]=r.qa[i]||['',''];r.qa[i][f]=v;save()}
function ADDQ(id){const r=S.done[id];r.qa=r.qa||[];if(r.qa.length<8)r.qa.push(['','']);save();render()}

function DL(id){const f=findLect(id);if(f&&confirm('"'+f.l.t+'"?')){f.s.lects=f.s.lects.filter(x=>x.id!==id);delete S.done[id];save();render()}}
function LEN(id,v){const f=findLect(id),n=parseLen(v);if(f&&n){f.l.len=n;save()}}

const CHK='<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.4l3.2 3.2L13 5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function head(){const g=diffD(today(),S.cfg.gate),d2=diffD(today(),S.cfg.target);
 const TT2={today:"Today's plan",rev:'Revision',ahead:'Ahead',subs:'Subjects',plan:'Progress',set:'Settings'}[S.tab];
 return `<div class="topbar"><div class="bigclock" id="bigclock">${clock(nowMin())}</div>
  <div class="tb2"><div class="tbd">${fmt(today())}</div>
  <div class="tbc"><b>${g}</b> ${t('days to GATE')} &nbsp;·&nbsp; <b>${d2>0?d2:0}</b> ${t('days of syllabus')}</div></div>
  <button class="gear" onclick="go('set')">⚙</button></div><h1>${t(TT2)}</h1>`}
function speedBar(){return `<div class="spd">${SPEEDS.map(s=>
 `<button class="${S.cfg.speed===s?'on':''}" onclick="SPD(${s})">${s}x</button>`).join('')}</div>`}
const lecMeta=x=>`<div class="meta"><span class="mod" style="color:${x.s.color}">${esc(x.l.mod)}</span>
 <span class="src">${esc(x.s.src||x.s.name)}</span></div>`;
function lecRow(x){
  const dn=!!S.done[x.l.id],r=dn?S.done[x.l.id]:null;let q='';
  if(dn){const list=(r.qa&&r.qa.length)?r.qa:[['',''],['',''],['','']];
    q=`<div class="qa">${list.map((p,i)=>`<div class="qarow">
     <input placeholder="${t('Question')} ${i+1}" value="${esc(p[0])}" oninput="QA('${x.l.id}',${i},0,this.value)">
     <input placeholder="${t('One-line answer')}" value="${esc(p[1])}" oninput="QA('${x.l.id}',${i},1,this.value)"></div>`).join('')}
     <button class="link xs" onclick="ADDQ('${x.l.id}')">${t('+ one more question')}</button></div>`}
  return `<div class="row ${dn?'done':''}"><button class="box" aria-checked="${dn}" onclick="TK('${x.l.id}')">${CHK}</button>
   <div class="body"><div class="t">${esc(x.l.t)}</div>${lecMeta(x)}${q}</div>
   <div class="len">${hm(x.l.len)}<div class="lensp">${hm(W(x.l.len))}</div></div></div>`}
function slot(t0,mins,color,name,inner,note){
 return `<div class="slot"><div class="sh"><span class="clock">${clock(t0)}–${clock(t0+mins)}</span>
 <span class="dot" style="background:${color}"></span><span class="nm">${esc(name)}</span><span class="len">${hm(mins)}</span></div>
 <div class="sb">${inner}${note?`<div class="sm faint" style="padding:9px 0 3px">${note}</div>`:''}</div></div>`}
const revItemRow=it=>{const late=diffD(it.due,today());
  const badge=it.kind==='mod'?`<span class="stage">${t('module')} · ${it.n}</span>`:`<span class="stage">${t(STG[it.stage])||(it.stage+1)+'×'}</span>`;
  const ttl=it.kind==='mod'?it.mod:it.l.t;
  const rr=it.kind==='lect'?S.done[it.id]:null,qs=(rr&&rr.qa)?rr.qa.filter(x=>x&&x[0]):[];
  return `<div class="row"><button class="box" aria-checked="false" onclick="RD('${it.id}')">${CHK}</button>
   <div class="body"><div class="t">${esc(ttl)}</div>
   <div class="meta"><span class="mod" style="color:${it.s.color}">${esc(it.s.name)}</span> ${badge}${late>0?`<span class="lt">${late}d ${t('late')}</span>`:''}</div>
   ${qs.length?`<div class="qa">${qs.map(x=>`<div class="q" onclick="REVEAL(this)">${esc(x[0])}</div><div class="a hidden">${esc(x[1])||'—'}</div>`).join('')}</div>`
     :`<div class="sm faint" style="margin-top:5px">${t('No questions were written for this one.')}</div>`}
   <button class="link xs lt" style="margin-top:7px" onclick="RF('${it.id}')">${t('Could not recall')}</button></div>
   <div class="len">${it.mins}m</div></div>`};

function buildDay(){
  const P=planToday(),r=P.r,dEnd=endFor(today());
  const blocks=[];
  if(P.rev.items.length)blocks.push({kind:'rev',mins:P.rev.mins,html:P.rev.items.map(revItemRow).join(''),
    color:'var(--plum)',name:t('Revision — do this first'),
    note:t('Read the question, answer from memory, then tap to check.')+(P.rev.hidden?` ${P.rev.hidden} ${t('more tomorrow.')}`:'')});
  ['em','A','B','side'].forEach(tr=>{const dn=P.doneToday.filter(x=>x.s.track===tr),L=[...dn,...r[tr]];
    if(L.length)blocks.push({kind:'lec',tr,L,color:L[0].s.color,
      name:tr==='em'?t('Engineering maths')+' — '+L[0].s.name:L[0].s.name,
      note:tr==='em'?t('At least one maths lecture every day.'):''})});
  if(r.prac>10)blocks.push({kind:'prac',mins:r.prac,color:'var(--pen)',name:t("Practice — questions on today's topics"),
    html:`<div class="pr">${t('No video here. Do PYQs and questions on what you studied today. This is where marks come from.')}</div>`,note:''});
  /* one unit per lecture, so a meal can land between lectures */
  const units=[];
  blocks.forEach(b=>{if(b.kind==='lec')b.L.forEach(x=>units.push({b,mins:W(x.l.len),html:lecRow(x)}));
    else units.push({b,mins:b.mins,html:b.html})});
  const st0=startMin();
  const meals=(S.cfg.meals||[]).map(m=>({n:t(m.n),t:m.t,m:m.m}))
    .filter(m=>m.m>0&&m.t>=st0&&m.t+m.m<=dEnd).sort((a,b)=>a.t-b.t);
  let cur=st0,mi=0,h='',study=0,g=null,gStart=st0,lastBrk=false;
  const pos=()=>g?gStart+g.mins:cur;
  const flush=()=>{if(!g)return;const mins=snapUp(g.mins);
    h+=slot(gStart,mins,g.b.color,g.b.name,g.html,g.b.note);
    cur=gStart+mins;study+=g.mins;g=null;lastBrk=false};
  units.forEach(u=>{
    const newBlock=!g||g.b!==u.b;
    if(newBlock&&g){flush();
      if(!(mi<meals.length&&cur+Math.floor(u.mins/2)>=meals[mi].t)&&cur+S.cfg.gap+snapUp(u.mins)<=dEnd){
        h+=`<div class="brk"><span class="clock">${clock(cur)}–${clock(cur+S.cfg.gap)}</span>${t('Break')} · ${S.cfg.gap} ${t('min')}</div>`;
        cur+=S.cfg.gap;lastBrk=true}}
    if(mi<meals.length&&pos()+Math.floor(u.mins/2)>=meals[mi].t){
      if(g)flush();
      const M=meals[mi],at=snap(cur>=M.t?cur:(M.t-cur<=30?M.t:cur));
      if(at>cur&&!lastBrk)h+=`<div class="brk"><span class="clock">${clock(cur)}–${clock(at)}</span>${t('Break')} · ${at-cur} ${t('min')}</div>`;
      h+=`<div class="brk meal"><span class="clock">${clock(at)}–${clock(at+M.m)}</span><b>${M.n}</b> · ${M.m} ${t('min')}</div>`;
      cur=at+M.m;mi++;lastBrk=false}
    if(!g){g={b:u.b,mins:0,html:''};gStart=cur}
    g.mins+=u.mins;g.html+=u.html});
  flush();
  return{h,end:cur,study,bud:r.bud,start:st0}}

function viewToday(){
  const dEnd=endFor(today()),late=S.startedAt&&S.startedAt.date===today();
  const top=`<div class="card"><div class="sec"><h2>${late?t('Started at')+' '+clock(S.startedAt.at):t('Running to plan')}</h2>
   <span class="mono muted">${isGym(today())?t('Gym day'):t('Study day')} · ${t('ends')} ${clock(dEnd)}</span></div>
   <p class="sm muted" style="margin:0 0 10px">${late?t('Today was rebuilt from that time, trimmed to fit before the day ends.')
     :t('Woke up late or starting mid-day? Rebuild today from right now.')}</p>
   <button class="btn wide" onclick="STARTNOW()">${t('Start now')} — ${clock(snapUp(nowMin()))}</button>
   ${late?`<button class="link" style="margin-top:11px" onclick="STARTRESET()">${t('Back to the normal start time')}</button>`:''}</div>`;
  BUDCAP=null;
  let d=buildDay(),guard=0;
  while(d.end>dEnd&&guard++<40){BUDCAP=Math.max(0,(BUDCAP==null?d.bud:BUDCAP)-15);d=buildDay()}
  BUDCAP=null;
  if(!d.study)return top+`<div class="card"><div class="empty">${t('No time left before the day ends.')}</div></div>`;
  const T=totals(),pc=T.tm?Math.round(T.dm/T.tm*100):0;
  return top+d.h+`<div class="card"><div class="sec"><h2>${t('Today')}</h2>
   <span class="mono muted">${hm(d.study)} ${t('study')}</span></div>
   <div class="sm muted">${clock(d.start)} – ${clock(d.end)} ${t('including breaks and meals.')}</div>
   <div class="bar" style="margin-top:9px"><i style="width:${pc}%;background:var(--pen)"></i></div>
   <div class="sm muted" style="margin-top:7px">${pc}% ${t('of the course done')} · ${hm(T.tm-T.dm)} ${t('left at')} ${S.cfg.speed}x</div>${speedBar()}</div>`}

  const weeks=[];

function IMP(rep){const sid=document.getElementById('psub').value,tx=document.getElementById('ptext').value;
 const s=S.subs.find(x=>x.id===sid);if(!s||!tx.trim())return;
 const got=parseList(tx,S.cfg.defLen||40);if(!got.length){alert(t('Nothing was parsed.'));return}
 s.lects=rep?got:s.lects.concat(got);
 const m=[];s.lects.forEach(l=>{if(!m.includes(l.mod))m.push(l.mod)});s.modOrd=m;
 document.getElementById('ptext').value='';save();render();alert(got.length+' '+t('lectures added.'))}
function MV(id,dir){const s=S.subs.find(x=>x.id===id),L=S.subs.filter(x=>x.track===s.track).sort((a,b)=>a.ord-b.ord);
 const i=L.indexOf(s),j=i+dir;if(j<0||j>=L.length)return;const x=L[j].ord;L[j].ord=s.ord;s.ord=x;save();render()}
function MM(id,j,dir){const s=S.subs.find(x=>x.id===id);
 if(!s.modOrd||!s.modOrd.length)s.modOrd=[...new Set(s.lects.map(l=>l.mod))];
 const k=j+dir;if(k<0||k>=s.modOrd.length)return;const a=s.modOrd,x=a[j];a[j]=a[k];a[k]=x;save();render()}
const TG=id=>{const s=S.subs.find(x=>x.id===id);s.on=!s.on;save();render()};
const HR=(i,v)=>{S.cfg.hours[i]=Math.max(0,+v||0);save();render()};
const HRALL=v=>{S.cfg.hours=S.cfg.hours.map(()=>Math.max(0,+v||0));save();render()};
const ST=(i,v)=>{const p=String(v).split(':');S.cfg.startT[i]=snap((+p[0])*60+(+p[1]||0));save();render()};
const STALL=v=>{const p=String(v).split(':'),m=snap((+p[0])*60+(+p[1]||0));S.cfg.startT=S.cfg.startT.map(()=>m);save();render()};
const MEAL=(i,f,v)=>{const m=S.cfg.meals[i];if(!m)return;
 if(f==='t'){const p=String(v).split(':');m.t=snap((+p[0])*60+(+p[1]||0))}else m.m=snap(Math.max(0,+v||0));save();render()};
const GYM=(k,v)=>{S.cfg.gym[k]=v;save();render()};
const DAYT=(w,k,v)=>{const p=String(v).split(':');S.cfg.day[w][k]=snap((+p[0])*60+(+p[1]||0));save();render()};
function gymDay(){for(let n=0;n<14;n++){const d=addD(today(),n);if(isGym(d))return d}return today()}
function nonGymDay(){for(let n=0;n<14;n++){const d=addD(today(),n);if(!isGym(d))return d}return today()}
const GYMDAY=i=>{const d=S.cfg.gym.days||[];const j=d.indexOf(i);j>=0?d.splice(j,1):d.push(i);S.cfg.gym.days=d;save();render()};
const DAYEND=v=>{const p=String(v).split(':');S.cfg.dayEnd=snap((+p[0])*60+(+p[1]||0));save();render()};
const CF=(k,v)=>{S.cfg[k]=v;save();render()};
function EX(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='gate-'+today()+'.json';a.click()}
function IMF(el){const f=el.files[0];if(!f)return;const r=new FileReader();

async function initSync(){if(!FIREBASE_CFG)return;
 try{const ap=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js');
  const rt=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js');
  const app=ap.initializeApp(FIREBASE_CFG);
  const ref=rt.ref(rt.getDatabase(app),'plans/'+SYNC_ID);
  db={rt,ref};
  rt.onValue(ref,snapx=>{const v=snapx.val();
    if(!v||!v.blob){push();syncMsg=t('Cloud was empty — uploaded now');render();return}
    try{const inc=JSON.parse(v.blob);
      if((inc._at||0)>(S._at||0)){S=migrate(inc);SIMC={};rawSet(v.blob);syncMsg=t('Update arrived from another device')+' '+new Date(v.at).toLocaleTimeString();render()}
      else{syncMsg=t('Sync on · cloud')+' '+new Date(v.at||Date.now()).toLocaleString();render()}
    }catch(e){syncMsg=t('Could not read the cloud data')}},
    err=>{syncMsg=t('Sync stopped')+': '+err.code+' — '+t('check Firebase rules');render()});
 }catch(e){syncMsg=t('Firebase did not load')+': '+e.message;console.warn(e)}}
async function push(){if(!db)return;try{S._at=Date.now();
  await db.rt.set(db.ref,{blob:JSON.stringify(S),at:S._at});syncMsg=t('Saved')+' '+new Date(S._at).toLocaleTimeString();
 }catch(e){syncMsg=t('Could not save')+': '+e.message}}

function render(){
 const V={today:viewToday,rev:viewRev,ahead:viewAhead,subs:viewSubs,plan:viewPlan,set:viewSet}[S.tab]||viewToday;
 let body;
 try{body=head()+V()}
 catch(err){console.error(err);
  body=`<h1>Something broke</h1><div class="card warn"><h2>This screen could not be drawn</h2>
   <p class="sm" style="margin:6px 0 10px">${esc(String(err&&err.message||err))}</p>
   <button class="btn wide" onclick="go('today')">Go to Today</button>
   <button class="link lt" style="margin-top:12px" onclick="RS()">Reset everything</button></div>`}
 document.getElementById('app').innerHTML=body;
 const rc=dueRev(today()).items.length;
 document.getElementById('nav').innerHTML=[['today','Today'],['rev','Revision'],['ahead','Ahead'],['subs','Subjects'],['plan','Progress']]
  .map(([k,l])=>`<button aria-current="${S.tab===k}" onclick="go('${k}')"><span class="pip"></span>${t(l)}${(k==='rev'&&rc)?' '+rc:''}</button>`).join('')}
setInterval(()=>{const e=document.getElementById('bigclock');if(e)e.textContent=clock(nowMin())},20000);
const TABS=['today','rev','ahead','subs','plan'];
let tsX=0,tsY=0,tsT=0,tsOK=false;
function swipeTo(tab,dir){
 S.tab=tab;save();render();scrollTo(0,0);
 const el=document.getElementById('app');
 if(!el)return;el.style.animation='none';void el.offsetWidth;
 el.style.animation=(dir>0?'slideL':'slideR')+' .17s ease-out'}
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1){tsOK=false;return}
 const t=e.target;
 tsOK=!(t&&t.closest&&t.closest('input,textarea,select,button,a,.spd,.tbl,pre,summary'));
 tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;tsT=Date.now()},{passive:true});
document.addEventListener('touchend',e=>{
 if(!tsOK||!e.changedTouches||!e.changedTouches.length)return;
 tsOK=false;
 if(Date.now()-tsT>800)return;
 const dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;
 if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
 const i=TABS.indexOf(S.tab);if(i<0)return;
 const j=i+(dx<0?1:-1);if(j<0||j>=TABS.length)return;
 swipeTo(TABS[j],dx<0?1:-1)},{passive:true});

function migrate(x){
 if(!x||!x.cfg||!x.subs)return fresh();
 const F=fresh(),c=x.cfg;
 if(!c.meals){c.meals=F.cfg.meals.slice();
   if(c.lunch)c.meals[1]={n:'Lunch',t:c.lunch.t,m:c.lunch.m};
   if(c.dinner)c.meals[2]={n:'Dinner',t:c.dinner.t,m:c.dinner.m}}
 delete c.lunch;delete c.dinner;
 if(!c.gym)c.gym=F.cfg.gym;
 if(!c.gym.mode)c.gym.mode='alt';
 if(!c.gym.days)c.gym.days=[1,3,5];
 if(!c.gym.anchor)c.gym.anchor=today();
 if(!c.day)c.day={study:{start:(c.startT&&c.startT[1])||405,end:c.dayEnd||1320},
   gym:{start:(c.gym&&c.gym.start)||580,end:c.dayEnd||1320}};
 if(!c.day.study)c.day.study={start:405,end:1320};
 if(!c.day.gym)c.day.gym={start:580,end:1320};
 delete c.hours;delete c.startT;delete c.dayEnd;delete c.gym.hours;delete c.gym.start;
 if(!c.revMode)c.revMode='smart';
 if(!c.lang)c.lang='en';
 if(c.emFill===undefined)c.emFill=true;
 if(!c.gap||c.gap<5)c.gap=10;
 if(!c.revCap||c.revCap<20)c.revCap=90;
 if(!c.speed)c.speed=1.75;
 if(!c.split)c.split={A:.44,B:.30,side:.14,prac:.12};
 if(!x.done)x.done={};
 if(!x.mods)x.mods={};
 if(x.startedAt&&x.startedAt.date!==today())delete x.startedAt;
 x.subs.forEach(su=>{if(!su.src){const m=F.subs.find(y=>y.name===su.name);if(m)su.src=m.src}});
 return x}

(async()=>{const raw=await rawGet();
 try{S=raw?JSON.parse(raw):fresh()}catch(e){S=fresh()}
 S=migrate(S);
 render();initSync()})();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
